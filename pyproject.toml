[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchx-native"
version = "0.2.0"
description = "Unified native multi-provider search CLI for coding agents and research workflows"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "local"}]
dependencies = []

[project.scripts]
searchx = "searchx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
searchx = ["data/*.json"]

