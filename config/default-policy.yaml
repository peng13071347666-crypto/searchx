# Adaptive Search default policy.
# This file is a human-readable strategy reference. It contains no secrets and
# is intentionally not a runtime dependency; the CLI remains self-contained.

version: 1
native_search:
  preferred: disabled
  codex_config_value: 'web_search = "disabled"'

routing:
  default:
    providers: [brave, exa, tavily]
    rotation_preference: 'brave:exa:tavily = 2:1:1'
  research:
    providers: [exa, tavily, brave]
  semantic:
    providers: [exa, tavily, brave]
  news:
    providers: [newsapi, tavily, brave, exa]
  cn:
    providers: [baidu, newsapi, tavily, brave]
  code:
    providers: [github, brave, exa]
  google:
    providers: [serper]
    explicit_only: true
  page_extraction:
    providers: [direct_trafilatura, tavily, exa, firecrawl]
    firecrawl_role: advanced_last_fallback

depth:
  quick:
    max_provider_rounds: 2
    second_provider: conditional
    max_result_count: 5
    fetch_pages: 1
    fetch_context_chars: 8000
  balanced:
    max_provider_rounds: 2
    second_provider: conditional
    max_result_count: 8
    fetch_pages: 2
    fetch_context_chars: 16000
  deep:
    min_provider_rounds: 2
    max_provider_rounds: 3
    third_provider: only_for_gap_or_conflict
    max_result_count: 12
    fetch_pages: 4
    normal_fetch_pages: '2-3'
    fetch_context_chars: 24000

follow_up:
  trigger_when:
    - no_results
    - sparse_results
    - low_domain_diversity
    - weak_snippets
    - missing_freshness
    - independent_evidence_needed
  prefer_unused_provider: true
  repeated_same_provider: only_when_no_suitable_alternative
  firecrawl_in_discovery: false

page_compaction:
  per_page_chars: '6000-8000'
  no_lexical_match:
    mode: bounded_overview
    max_ratio_of_page_budget: 0.333
    max_chars: 2400
    keep: [identity, lead, headings, evenly_spaced_body_samples]
  dynamic_placeholder:
    treat_as: extraction_failure
    examples: ['加载中...', 'Loading...', 'Please wait']
    cache_as_valid_evidence: false

cache:
  search_news_seconds: 300
  search_cn_seconds: 7200
  search_default_seconds: 21600
  page_compaction_seconds: 21600
  historical_task_budget_blocks_search: false

secrets:
  file: '~/.config/searchx/secrets.env'
  environment_variables:
    - BRAVE_API_KEY
    - EXA_API_KEY
    - TAVILY_API_KEY
    - BAIDU_QIANFAN_API_KEY
    - BAIDU_API_KEY
    - NEWS_API_KEY
    - GITHUB_API_KEY
    - GITHUB_TOKEN
    - FIRECRAWL_API_KEY
    - SERPER_API_KEY
    - SEARXNG_URL
